[versions]
android = "8.1.0"
hiltAndroid = "2.44"
junit = "4.13.2"
kotlin = "1.8.10"
kotlinxCoroutinesAndroid = "1.6.4"
lifecycleLivedataKtx = "2.5.1"
moshi = "1.14.0"
navigationFragmentKtx = "2.5.3"
okhttp = "4.12.0"
uiAndroid = "1.5.4"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.8.2" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.5.1" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.1.4" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.9.0" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version = "3.5.0" }
androidx-fragment-testing = { module = "androidx.fragment:fragment-testing", version = "1.6.2" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.1.4" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-material3 = { module = "androidx.compose.material3:material3", version = "1.1.2" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.7.6" }
