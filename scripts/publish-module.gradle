apply plugin: 'maven-publish'
apply plugin: 'signing'

def isAndroidLibrary = project.plugins.findPlugin("com.android.library") != null

if (isAndroidLibrary) {
    // AGP builds the sources jar (releaseSourcesJar) and attaches it to
    // components.release. Don't register our own Jar task as well: both
    // write build/libs/<name>-<version>-sources.jar, which makes Gradle fail
    // generateMetadataFileForReleasePublication with an implicit-dependency error.
    android {
        publishing {
            singleVariant("release") {
                withSourcesJar()
            }
        }
    }
} else {
    task androidSourcesJar(type: Jar) {
        archiveClassifier.set('sources')
        from sourceSets.main.java.srcDirs
    }

    artifacts {
        archives androidSourcesJar
    }
}

group = PUBLISH_GROUP_ID
version = PUBLISH_VERSION

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // The coordinates of the library, being set from variables that
                // we'll set up later
                groupId PUBLISH_GROUP_ID
                artifactId PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION

                // We want to release both the executable that can be run
                // by a device and the source code. We include the source
                // code for transparency so that developers can look
                // around for themselves.

                // this code block exposes primary artifact (the executable)
                if (isAndroidLibrary) {
                    // executable + sources jar for forage-android
                    // (sources come from withSourcesJar() above)
                    from components.release
                } else {
                    // executable for sample-app
                    artifact("$buildDir/libs/${project.getName()}-${version}.jar")
                    // source code, created above by `task androidSourcesJar(type: Jar)`
                    artifact androidSourcesJar
                }

                // Mostly self-explanatory metadata
                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = PUBLISH_DESCRIPTION
                    url = PUBLISH_URL
                    licenses {
                        license {
                            name = PUBLISH_LICENSE_NAME
                            url = PUBLISH_LICENSE_URL
                        }
                    }
                    developers {
                        developer {
                            id = PUBLISH_DEVELOPER_ID
                            name = PUBLISH_DEVELOPER_NAME
                            email = PUBLISH_DEVELOPER_EMAIL
                        }
                    }

                    // Version control info - if you're using GitHub, follow the
                    // format as seen here
                    scm {
                        connection = PUBLISH_SCM_CONNECTION
                        developerConnection = PUBLISH_SCM_DEVELOPER_CONNECTION
                        url = PUBLISH_SCM_URL
                    }
                }
            }
        }
    }
}

ext["signing.keyId"] = rootProject.ext["signing.keyId"]
ext["signing.password"] = rootProject.ext["signing.password"]
ext["signing.secretKeyRingFile"] = rootProject.ext["signing.secretKeyRingFile"]

signing {
    sign publishing.publications
}