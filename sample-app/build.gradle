plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.androidx.navigation.safeargs.kotlin)
    alias(libs.plugins.dagger.hilt.android)
    alias(libs.plugins.org.jetbrains.kotlin.kapt)
    alias(libs.plugins.com.google.devtools.ksp)
    alias(libs.plugins.org.jetbrains.kotlin.plugin.serialization)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'com.joinforage.android.example'
    compileSdk 34

    defaultConfig {
        applicationId "com.joinforage.android.example"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        /**
         * IF YOU WANT TO ENABLE PROGUARD, USE THESE BUILD TYPES
         */
//        release {
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//        }
//        debug {
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        compose true
    }

    kapt {
        correctErrorTypes true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.4.4'
    }
}

dependencies {
//    this line tests against the local forage-android
    implementation(project(":forage-android"))

//    uncomment this line 👇 to test against remote Sonatype repository forage-android
//    implementation("com.joinforage:forage-android:<some_version_you_want_to_test>")

    // we include this dependency to ensure that our workaround for
    // including Datadog v2 in forage-android continues to work.
    // That is, if our workaround fails, the presence of datadog v1
    // in the sample app along side datadog v2 should fail to build
    // NOTE: we need to comment this out for PCI compliance since
    // 1.19.2 has a vulnerability; let's keep this here in case
    // we ever need to debug in the future
//    implementation("com.datadoghq:dd-sdk-android:1.19.2")

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.kotlinx.serialization.json

    implementation libs.hilt.android
    implementation files('libs/CpaySDKLibV4.0.9_20230420.jar')
    kapt libs.hilt.compiler

    // Compose
    implementation libs.androidx.ui.android
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.material3
    implementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.tooling.preview

    // Used only for doing requests from the sample app, not a requirement for the ForageSDK
    // Retrofit + Moshi to create the Payment Object
    implementation libs.okhttp
    implementation libs.moshi
    implementation libs.moshi.kotlin
    ksp libs.moshi.kotlin.codegen
    implementation libs.moshi.adapters
    implementation libs.logging.interceptor
    implementation libs.kotlinx.coroutines.android

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    debugImplementation libs.androidx.fragment.testing
}