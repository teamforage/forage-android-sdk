// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.com.diffplug.spotless)
    alias(libs.plugins.androidx.navigation.safeargs.kotlin) apply false
    alias(libs.plugins.gradle.nexus.publish.plugin)
    alias(libs.plugins.jetbrains.kotlinx.kover)
    alias(libs.plugins.jetbrains.dokka)
    alias(libs.plugins.org.jetbrains.kotlin.kapt) apply false
}

subprojects {
    if (name != "forage-android") return

    apply plugin: 'org.jetbrains.dokka'

    tasks.named("dokkaHtml", org.jetbrains.dokka.gradle.DokkaTask.class) {
        outputDirectory.set(file("${rootDir}/reference-docs"))

        String dokkaBaseConfiguration = """
        {
          "footerMessage": "© 2023–2026 <a href=\\"https://www.joinforage.com/\\"style=\\"color: inherit; text-decoration: none;\\">Forage Technology Corporation</a>.",
          "separateInheritedMembers": true
        }
        """

        pluginsMapConfiguration.set(
            ["org.jetbrains.dokka.base.DokkaBase": dokkaBaseConfiguration]
        )
    }
}

spotless {
    kotlin {
        target '**/src/**/*.kt', '**/src/**/*.kts'
        ktlint()
    }
    kotlinGradle {
        target '*.gradle.kts'
        ktlint()
    }
}


allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_1_8.toString()
        }
    }
}

apply from: "${rootDir}/scripts/publish-root.gradle"
