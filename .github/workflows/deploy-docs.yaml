name: Generate and Publish Dokka Docs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v6.0.2 = de0fac2e4500dabe0009e67214ff5f5447ce83dd
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: "17"
          distribution: "zulu"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0

      - name: Generate Dokka documentation
        run: ./gradlew dokkaHtml

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dokka-docs
          path: reference-docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24

      - name: Install Netlify
        run: npm install netlify-cli@23 -g

      - name: Download docs artifact
        uses: actions/download-artifact@v5
        with:
          name: dokka-docs
          path: reference-docs

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir reference-docs --site ${{ secrets.NETLIFY_SITE_ID }} --auth ${{ secrets.NETLIFY_API_TOKEN }}
